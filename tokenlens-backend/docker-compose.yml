services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tokenlens-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ENVIRONMENT=development
      - PORT=8000
    env_file:
      - .env
    volumes:
      # Montaje de volumen para live-reload durante el desarrollo
      - ./app:/app/app
      - ./run.py:/app/run.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s